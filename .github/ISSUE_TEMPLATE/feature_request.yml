name: Feature request
description: Suggest something Islet should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check [ROADMAP.md](../blob/main/ROADMAP.md) first — it lists what is planned,
        and also what is deliberately not planned and why.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: |
        Describe the situation you are in when you would want this, rather than the solution.
        Islet's job is answering a question without making you switch away from your work.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
    validations:
      required: true

  - type: dropdown
    id: state
    attributes:
      label: Which island state would show it
      options:
        - Active — worth showing in the strips beside the notch
        - Expanded — belongs in the panel when you hover
        - Both
        - Not sure
    validations:
      required: true
