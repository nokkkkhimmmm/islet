name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build --build-tests

      # IsletCore is deliberately free of AppKit and SwiftUI so the whole suite runs
      # headless on a CI runner with no display attached.
      - name: Test
        run: swift test --skip-build

      - name: Assemble app bundle
        run: Scripts/build-app.sh release

      # A bundle that cannot start is a broken release even when every test passes, so
      # exercise the real binary. --diagnose exits immediately and needs no display.
      - name: Smoke test the bundle
        run: |
          ./dist/Islet.app/Contents/MacOS/Islet --diagnose
          ./dist/Islet.app/Contents/MacOS/Islet --dump-sessions

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Islet-app
          path: dist/Islet.app
          if-no-files-found: error
